<!DOCTYPE html>
<html>
<head>
    <title>Student Result Predictor</title>
</head>
<body>

    <h2>Student Result Predictor</h2>

    <label>Math Marks:</label>
    <input type="number" id="math"><br><br>

    <label>English Marks:</label>
    <input type="number" id="english"><br><br>

    <button onclick="predict()">Submit</button>

    <h3 id="result"></h3>

    <hr>

    <button onclick="loadStudents()">Show All Students</button>

    <ul id="studentsList"></ul>

<script>

async function predict() {
    let math = document.getElementById("math").value;
    let english = document.getElementById("english").value;

    let response = await fetch("http://127.0.0.1:8000/predict?math=" + math + "&english=" + english, {
        method: "POST"
    });

    let data = await response.json();

    document.getElementById("result").innerText =
        "Result: " + data.result + " (ID: " + data.id + ")";
}

async function loadStudents() {
    let response = await fetch("http://127.0.0.1:8000/students");
    let data = await response.json();

    let list = document.getElementById("studentsList");
    list.innerHTML = "";

    data.forEach(student => {
        let li = document.createElement("li");
        li.innerText = 
            "ID: " + student.id +
            " | Math: " + student.math +
            " | English: " + student.english +
            " | Result: " + student.result;
        list.appendChild(li);
    });
}

</script>

</body>
</html>
